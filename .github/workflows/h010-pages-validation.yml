name: H010 Public Pages Read-only Validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'downloads/index.html'
      - 'pages/agent/index.html'
      - 'tests/pages/h010-release-chart.test.cjs'
      - '.github/workflows/h010-pages-validation.yml'
  push:
    branches:
      - 'fix/h010-chart-cdn-fallback'
    paths:
      - 'index.html'
      - 'downloads/index.html'
      - 'pages/agent/index.html'
      - 'tests/pages/h010-release-chart.test.cjs'
      - '.github/workflows/h010-pages-validation.yml'

permissions:
  contents: read

jobs:
  test-release-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Validate page scripts and chart isolation
        run: node --test tests/pages/h010-release-chart.test.cjs
