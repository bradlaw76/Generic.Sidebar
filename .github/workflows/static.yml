# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Read-only staging verification; no Pages deployment from pull requests.
  pull_request:
    paths:
      - '.github/workflows/static.yml'
      - 'index.html'
      - 'downloads/index.html'
      - 'pages/agent/index.html'
      - 'pages/copilot/index.html'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Isolate read-only PR validation from production Pages deployment queuing.
# Preserve the existing "pages" group for main pushes and manual deployments.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify Pages allowlist without deployment
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stage allowlisted public site only
        shell: bash
        run: |
          set -euo pipefail
          # Never reuse checkout-provided staging paths: hidden symlinks evade
          # a find -type f inventory and may be dereferenced by artifact packing.
          if [ -e _site ] || [ -L _site ]; then
            echo 'Refusing preexisting Pages staging path: _site' >&2
            exit 1
          fi
          mkdir -- _site
          # Reject symlinked file or directory components before publishing.
          site_root="$(pwd -P)"
          for page in index.html downloads/index.html pages/agent/index.html pages/copilot/index.html; do
            if [ ! -f "$page" ] || [ "$(realpath -- "$page")" != "$site_root/$page" ]; then
              echo "Refusing missing/non-regular or symlinked Pages source: $page" >&2
              exit 1
            fi
          done
          install -Dm644 index.html _site/index.html
          install -Dm644 downloads/index.html _site/downloads/index.html
          install -Dm644 pages/agent/index.html _site/pages/agent/index.html
          install -Dm644 pages/copilot/index.html _site/pages/copilot/index.html
          touch _site/.nojekyll
          actual="$(find _site -type f | sort)"
          expected="$(printf '%s\n' \
            _site/.nojekyll \
            _site/index.html \
            _site/downloads/index.html \
            _site/pages/agent/index.html \
            _site/pages/copilot/index.html | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected/missing file in GitHub Pages artifact' >&2
            exit 1
          fi
      - name: Verify staged HTML routes and anchors without network access
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlsplit

          origin = "https://bradlaw76.github.io"
          prefix = "/Generic.Sidebar/"
          routes = {
              "index.html", "downloads/index.html",
              "pages/agent/index.html", "pages/copilot/index.html",
          }

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.anchors = set()

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if value is None:
                          continue
                      if tag == "base" and key == "href":
                          raise ValueError("Unexpected base href in staged page")
                      if key in ("href", "src"):
                          self.links.append((value, self.getpos()[0]))
                      if key == "id" or (tag == "a" and key == "name"):
                          self.anchors.add(value)

          def target(source, value):
              url = urlsplit(urljoin(origin + prefix + source, value))
              if url.scheme not in ("http", "https") or url.netloc != urlsplit(origin).netloc:
                  return None
              path = unquote(url.path)
              if not path.startswith(prefix):
                  raise ValueError("same-origin link escapes project path")
              path = path[len(prefix):]
              if not path or path.endswith("/"):
                  path += "index.html"
              if path not in routes:
                  raise ValueError(f"not in staged allowlist: {path}")
              return path, unquote(url.fragment)

          # Positive and negative fixtures verify the resolver itself.
          assert target("pages/copilot/index.html", "../../downloads/#main") == ("downloads/index.html", "main")
          assert target("index.html", origin + prefix + "pages/agent/") == ("pages/agent/index.html", "")
          assert target("index.html", "https://github.com/bradlaw76/Generic.Sidebar") is None
          for missing in ("/Generic.Sidebar/missing.html", "/outside/", "downloads/absent.js"):
              try:
                  target("index.html", missing)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"Accepted unstaged route: {missing}")

          parsed = {}
          for route in sorted(routes):
              parser = Page()
              parser.feed((Path("_site") / route).read_text(encoding="utf-8"))
              parser.close()
              parsed[route] = parser
          count = 0
          errors = []
          for source, page in parsed.items():
              for value, line in page.links:
                  try:
                      dest = target(source, value)
                      if dest is None:
                          continue
                      count += 1
                      route, anchor = dest
                      if anchor and anchor not in parsed[route].anchors:
                          raise ValueError(f"missing anchor #{anchor} in {route}")
                  except ValueError as error:
                      errors.append(f"{source}:{line}: {error}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Verified {count} same-origin staged href/src references across {len(parsed)} HTML files")
          PY
  # Production Pages deployment remains push-to-main/manual only.
  deploy:
    # Manual dispatch accepts arbitrary branch/tag refs; publish from main only.
    # PR validation always remains read-only and cannot enter this job.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage allowlisted public site only
        shell: bash
        run: |
          set -euo pipefail
          # Never reuse checkout-provided staging paths: hidden symlinks evade
          # a find -type f inventory and may be dereferenced by artifact packing.
          if [ -e _site ] || [ -L _site ]; then
            echo 'Refusing preexisting Pages staging path: _site' >&2
            exit 1
          fi
          mkdir -- _site
          # Reject symlinked file or directory components before publishing.
          site_root="$(pwd -P)"
          for page in index.html downloads/index.html pages/agent/index.html pages/copilot/index.html; do
            if [ ! -f "$page" ] || [ "$(realpath -- "$page")" != "$site_root/$page" ]; then
              echo "Refusing missing/non-regular or symlinked Pages source: $page" >&2
              exit 1
            fi
          done
          install -Dm644 index.html _site/index.html
          install -Dm644 downloads/index.html _site/downloads/index.html
          install -Dm644 pages/agent/index.html _site/pages/agent/index.html
          install -Dm644 pages/copilot/index.html _site/pages/copilot/index.html
          touch _site/.nojekyll
          actual="$(find _site -type f | sort)"
          expected="$(printf '%s\n' \
            _site/.nojekyll \
            _site/index.html \
            _site/downloads/index.html \
            _site/pages/agent/index.html \
            _site/pages/copilot/index.html | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected/missing file in GitHub Pages artifact' >&2
            exit 1
          fi
      - name: Upload allowlisted site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
