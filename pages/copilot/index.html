<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copilot Agent Chat</title>
  <meta name="description" content="Copilot Virtual Agent chat for Generic.Sidebar — submit issues and get help." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    iframe { width: 100%; border: 0; display: block; }
    /* Keep the loading/failure state reliable if the Tailwind CDN is blocked. */
    .hidden { display: none !important; }
    /* Preserve the full-height chat and error overlay when Tailwind is unavailable. */
    body { display: flex; flex-direction: column; min-height: 100vh; }
    nav { flex-shrink: 0; }
    main { position: relative; flex: 1 1 auto; min-height: 0; }
    #fallback:not(.hidden) { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; background: #f9fafb; }
    /* A cross-origin iframe can emit load even when blocked; always offer a manual exit. */
    .manual-fallback-link { position: fixed; top: 72px; right: 12px; z-index: 10; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #1d4ed8; font: 600 13px/1.4 system-ui, sans-serif; text-decoration: underline; }
    .manual-fallback-link:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  </style>
</head>
<body class="flex flex-col h-screen">
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex-shrink-0">
    <div class="max-w-7xl mx-auto flex items-center gap-6 text-sm font-medium text-gray-600">
      <a href="/Generic.Sidebar/" class="hover:text-gray-900">Home</a>
      <a href="/Generic.Sidebar/downloads/" class="hover:text-gray-900">Downloads</a>
      <a href="/Generic.Sidebar/pages/agent/" class="hover:text-gray-900">Agent</a>
      <a href="/Generic.Sidebar/pages/copilot/" class="text-gray-900 font-semibold">Copilot</a>
    </div>
  </nav>
  <main class="flex-1 relative">
    <iframe
      id="copilotFrame"
      title="Copilot Virtual Agent"
      src="https://gcc.powerva.microsoft.us/environments/79865a4a-1c0d-e50e-87a2-99bb39150642/bots/cr1ee_genericSidebarAgent/webchat?__version__=2"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
      style="width:100%;height:100%;">
    </iframe>
    <a id="manualFallback" class="manual-fallback-link" href="/Generic.Sidebar/pages/agent/">Chat blank or blocked? View agent instructions</a>
    <div id="fallback" class="hidden absolute inset-0 flex items-center justify-center bg-gray-50">
      <div class="text-center p-8">
        <p class="text-lg text-gray-700 mb-4">The Copilot agent could not be loaded.</p>
        <p class="text-sm text-gray-500 mb-4">This may be due to network restrictions or the bot being unavailable.</p>
        <a href="/Generic.Sidebar/pages/agent/" class="text-blue-600 hover:underline">View agent instructions instead</a>
      </div>
    </div>
  </main>
  <script>
    const frame = document.getElementById('copilotFrame');
    const fallback = document.getElementById('fallback');
    let loaded = false;
    let timeoutId;
    function showFallback() {
      clearTimeout(timeoutId);
      frame.classList.add('hidden');
      fallback.classList.remove('hidden');
    }
    frame.addEventListener('error', showFallback);
    frame.addEventListener('load', () => {
      loaded = true;
      clearTimeout(timeoutId);
    });
    // Show a fallback only when no iframe load event arrives within 15 seconds.
    // A load event is not proof the cross-origin bot is usable; live acceptance is separate.
    timeoutId = setTimeout(() => {
      if (!loaded) showFallback();
    }, 15000);
  </script>
</body>
</html>
