<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1060" viewBox="0 0 1780 1060" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Generic Sidebar reusable reference architecture</title>
  <desc id="diagram-desc">High-level architecture showing the Dynamics 365 host, Generic Sidebar runtime, Dataverse administration, and optional identity and communication adapters.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#107c10"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f7630c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5c2d91"/></marker>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #1e1e1e; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #323130; }
      .section { font: 700 18px 'Segoe UI', sans-serif; fill: #1e1e1e; letter-spacing: 0; }
      .box-title { font: 600 17px 'Segoe UI', sans-serif; fill: #1e1e1e; text-anchor: middle; }
      .box-text { font: 400 15px 'Segoe UI', sans-serif; fill: #1e1e1e; text-anchor: middle; }
      .small { font: 400 14px 'Segoe UI', sans-serif; fill: #1e1e1e; text-anchor: middle; }
      .note { font: 400 15px 'Segoe UI', sans-serif; fill: #1e1e1e; }
      .container { fill: none; stroke-width: 2; rx: 8; }
      .leaf { stroke-width: 2; rx: 6; }
      .flow { fill: none; stroke-width: 2.5; }
      .optional { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1780" height="1060" fill="#ffffff"/>
  <text x="70" y="62" class="title">Generic Sidebar - Reusable Reference Architecture</text>
  <text x="72" y="93" class="subtitle">Configuration-driven side panes for Dynamics 365 and model-driven apps</text>

  <rect x="70" y="120" width="1640" height="58" class="leaf" fill="#cfe4fa" stroke="#0078d4"/>
  <text x="890" y="155" class="box-title">REUSE CONTRACT   Stable host launcher  +  table-driven configuration  +  pluggable experiences  +  optional identity/service adapters</text>

  <rect x="250" y="220" width="400" height="690" class="container" stroke="#0078d4"/>
  <text x="280" y="260" class="section">1  HOST APPLICATION</text>

  <rect x="70" y="330" width="130" height="95" class="leaf" fill="#f3f2f1" stroke="#495057"/>
  <text x="135" y="369" class="box-title">Agent /</text>
  <text x="135" y="393" class="box-title">App user</text>

  <rect x="300" y="300" width="300" height="110" class="leaf" fill="#cfe4fa" stroke="#0078d4"/>
  <text x="450" y="341" class="box-title">Dynamics 365 / Model-driven app</text>
  <text x="450" y="370" class="box-text">Packaged or custom form</text>

  <rect x="300" y="485" width="300" height="115" class="leaf" fill="#cfe4fa" stroke="#0078d4"/>
  <text x="450" y="519" class="box-title">Form OnLoad launcher</text>
  <text x="450" y="546" class="box-text">Generic_OpenSidebar</text>
  <text x="450" y="571" class="box-text">sidebar_sidebar.js</text>

  <rect x="300" y="680" width="300" height="130" class="leaf" fill="#cfe4fa" stroke="#0078d4"/>
  <text x="450" y="716" class="box-title">Xrm.App.sidePanes</text>
  <text x="450" y="744" class="box-text">Persistent pane lifecycle</text>
  <text x="450" y="770" class="box-text">Open, reuse, focus</text>

  <path d="M200 377 L300 357" class="flow" stroke="#495057" marker-end="url(#arrow-gray)"/>
  <path d="M450 410 L450 485" class="flow" stroke="#0078d4" marker-end="url(#arrow-blue)"/>
  <path d="M450 600 L450 680" class="flow" stroke="#0078d4" marker-end="url(#arrow-blue)"/>

  <rect x="700" y="220" width="500" height="690" class="container" stroke="#107c10"/>
  <text x="730" y="260" class="section">2  GENERIC SIDEBAR RUNTIME</text>

  <rect x="760" y="300" width="380" height="105" class="leaf" fill="#dff6dd" stroke="#107c10"/>
  <text x="950" y="331" class="box-title">Configuration loader</text>
  <text x="950" y="359" class="box-text">Dataverse Web API</text>
  <text x="950" y="384" class="box-text">Default config + active linked agents</text>

  <rect x="760" y="475" width="380" height="115" class="leaf" fill="#dff6dd" stroke="#107c10"/>
  <text x="950" y="509" class="box-title">Route and policy decision</text>
  <text x="950" y="537" class="box-text">Standard canvas or SSO canvas</text>
  <text x="950" y="563" class="box-text">Validation, errors, retry state</text>

  <rect x="760" y="660" width="380" height="165" class="leaf" fill="#dff6dd" stroke="#107c10"/>
  <text x="950" y="692" class="box-title">Experience host (tabs 1-4)</text>
  <text x="950" y="720" class="box-text">Instructions + theme + icon</text>
  <text x="950" y="746" class="box-text">URL / approved HTML embed</text>
  <text x="950" y="772" class="box-text">Linked-agent picker</text>
  <text x="950" y="798" class="box-text">Pop-out and restore controls</text>

  <path d="M600 730 L670 730 L670 352 L760 352" class="flow" stroke="#107c10" marker-end="url(#arrow-green)"/>
  <path d="M950 405 L950 475" class="flow" stroke="#107c10" marker-end="url(#arrow-green)"/>
  <path d="M950 590 L950 660" class="flow" stroke="#107c10" marker-end="url(#arrow-green)"/>

  <rect x="1250" y="220" width="460" height="380" class="container" stroke="#f7630c"/>
  <text x="1280" y="260" class="section">3  ADMINISTRATION AND DATA</text>

  <rect x="1300" y="295" width="170" height="100" class="leaf" fill="#fff4ce" stroke="#f7630c"/>
  <text x="1385" y="326" class="box-title">Maker / Admin</text>
  <text x="1385" y="352" class="small">Model-driven</text>
  <text x="1385" y="375" class="small">admin app</text>

  <rect x="1500" y="295" width="170" height="115" class="leaf" fill="#fff4ce" stroke="#f7630c"/>
  <text x="1585" y="326" class="box-title">Sidebar Configuration</text>
  <text x="1585" y="352" class="small">sidebar_genericsidebar</text>
  <text x="1585" y="378" class="small">1 shared/default row</text>

  <rect x="1500" y="465" width="170" height="105" class="leaf" fill="#fff4ce" stroke="#f7630c"/>
  <text x="1585" y="496" class="box-title">Linked Agent rows</text>
  <text x="1585" y="522" class="small">0..N active agents</text>
  <text x="1585" y="547" class="small">Metadata + endpoint</text>

  <path d="M1470 345 L1500 345" class="flow" stroke="#f7630c" marker-end="url(#arrow-orange)"/>
  <path d="M1585 410 L1585 465" class="flow" stroke="#f7630c" marker-end="url(#arrow-orange)"/>
  <path d="M1500 352 L1140 352" class="flow optional" stroke="#f7630c" marker-end="url(#arrow-orange)"/>
  <text x="1320" y="335" class="small">read at runtime</text>

  <rect x="1250" y="640" width="460" height="270" class="container" stroke="#5c2d91"/>
  <text x="1280" y="680" class="section">4  OPTIONAL EXPERIENCE ADAPTERS</text>

  <rect x="1290" y="720" width="170" height="80" class="leaf" fill="#e8daef" stroke="#5c2d91"/>
  <text x="1375" y="752" class="box-title">Microsoft Entra ID</text>
  <text x="1375" y="778" class="small">MSAL user token</text>

  <rect x="1500" y="720" width="170" height="80" class="leaf" fill="#e8daef" stroke="#5c2d91"/>
  <text x="1585" y="752" class="box-title">Copilot Studio</text>
  <text x="1585" y="778" class="small">Token exchange + chat</text>

  <rect x="1290" y="825" width="170" height="60" class="leaf" fill="#e8daef" stroke="#5c2d91"/>
  <text x="1375" y="861" class="small">Web / phone sidecars</text>

  <rect x="1500" y="825" width="170" height="60" class="leaf" fill="#e8daef" stroke="#5c2d91"/>
  <text x="1585" y="861" class="small">Azure Function + ACS</text>

  <path d="M1140 530 L1210 530 L1210 760 L1290 760" class="flow optional" stroke="#5c2d91" marker-end="url(#arrow-purple)"/>
  <path d="M1460 760 L1500 760" class="flow" stroke="#5c2d91" marker-end="url(#arrow-purple)"/>
  <path d="M1140 755 L1210 755 L1210 855 L1290 855" class="flow optional" stroke="#5c2d91" marker-end="url(#arrow-purple)"/>
  <path d="M1460 855 L1500 855" class="flow" stroke="#5c2d91" marker-end="url(#arrow-purple)"/>

  <line x1="70" y1="938" x2="1710" y2="938" stroke="#d2d0ce" stroke-width="1"/>
  <text x="70" y="970" class="note"><tspan font-weight="700">FLOW:</tspan> user opens record -> form launches pane -> runtime reads Dataverse -> policy selects route -> configured experience renders</text>
  <text x="70" y="998" class="note"><tspan font-weight="700">REUSE:</tspan> keep the launcher and runtime stable; add or change experiences through configuration rows and narrowly scoped adapters</text>
  <text x="70" y="1026" class="note"><tspan font-weight="700">SECURITY BOUNDARY:</tspan> validate configured URLs/HTML, grant least-privilege iframe capabilities, and fail closed when an enabled identity route fails</text>
</svg>