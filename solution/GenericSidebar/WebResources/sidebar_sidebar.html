<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar v2.15.0 - Canonical Core Runtime</title>

  <style>
    :root {
      --band-bg: #0f5c73;
      --band-fg: #ffffff;
      --band-marker: #d6f0ff;
      --sidebar-primary: #0f5c73;
      --sidebar-text: #ffffff;
      --sidebar-link: #d6f0ff;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: #fff;
      overflow: hidden;
    }

    body { display: flex; flex-direction: column; }
    * { box-sizing: border-box; }

    /* Instructions band */
    .inst-band {
      background: var(--band-bg);
      color: var(--band-fg);
      padding: 10px 12px;
      display: none;
      flex-shrink: 0;
    }
    .inst-label { font-size: 12px; font-weight: 600; }
    .inst-body { font-size: 12px; line-height: 1.35; }
    .inst-body a { color: var(--sidebar-link); }
    .inst-body p { margin: 6px 0; }
    .inst-body ul, .inst-body ol { margin: 6px 0; padding-left: 1.25rem; }
    .inst-body li { margin: 3px 0; }
    .inst-body li::marker { color: var(--band-marker); }

    /* Layout Host */
    #host {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      padding: 16px;
      font-size: 12px;
      text-align: center;
    }

    .error {
      background: #fde7e9;
      border: 1px solid #d13438;
      padding: 12px;
      border-radius: 4px;
      margin: 8px;
      font-size: 12px;
      color: #a4262c;
    }

    /* Tabs */
    .tabs {
      display: flex;
      align-items: flex-end;
      padding: 4px 8px 0 8px;
      background: #f3f2f1;
      border-bottom: 1px solid #edebe9;
      gap: 4px;
      flex-shrink: 0;
      min-height: 32px;
    }

    .tab {
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      color: #605e5c;
      max-width: 240px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      background: transparent;
    }

    .tab.active {
      background: #ffffff;
      color: #201f1e;
      font-weight: 600;
      border-color: #edebe9;
      border-bottom-color: #ffffff;
    }

    /* Zoom Button */
    .zoom-btn {
      position: absolute;
      top: 4px;
      right: 8px;
      z-index: 25;
      background: transparent;
      border: 1px solid #edebe9;
      border-radius: 4px;
      color: #605e5c;
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
      display: none;
    }
    .zoom-btn:hover { background: #edebe9; }
    .zoom-btn.active {
      background: #c7e0f4;
      border-color: #0078d4;
      color: #0078d4;
      font-weight: 600;
    }

    /* Pop-out Button - now more visible */
    .popout-btn {
      position: absolute;
      top: 4px;
      right: 60px;
      z-index: 25;
      background: #f3f2f1;
      border: 1px solid #edebe9;
      border-radius: 4px;
      color: #323130;
      font-size: 14px;
      padding: 4px 8px;
      cursor: pointer;
      display: none;
    }
    .popout-btn:hover {
      background: #edebe9;
      color: #0078d4;
    }

    /* Pop-out Placeholder - shows when content is popped out */
    .popout-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      z-index: 20;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .popout-placeholder.active {
      display: flex;
    }
    .popout-placeholder p {
      color: #605e5c;
      font-size: 13px;
      margin: 0;
      max-width: 280px;
    }
    .focus-btn, .restore-btn {
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #0078d4;
    }
    .focus-btn {
      background: #0078d4;
      color: white;
    }
    .focus-btn:hover {
      background: #106ebe;
    }
    .restore-btn {
      background: white;
      color: #0078d4;
    }
    .restore-btn:hover {
      background: #f3f2f1;
    }
    .restore-note {
      font-size: 11px;
      color: #a19f9d;
      margin-top: 12px;
    }

    /* Panel Container */
    .panel-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: #faf9f8;
    }

    .panel-container iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      overflow-y: auto !important;
      transition: transform 0.2s ease;
    }

    /* Non-zoomed iframes - subtle visual frame */
    .panel-container iframe.framed:not(.force-zoom) {
      margin: 4px;
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      border: 1px solid #e1dfdd;
      border-radius: 4px;
      background: white;
    }

    /* Zooming for Genesys / phone simulators - NO framing */
    .force-zoom {
      width: 320px !important;
      min-width: 320px !important;
      max-width: 320px !important;
      height: 64% !important;
      transform-origin: 0 0;
      transform: scale(1.56);
      margin: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      background: white !important;
    }
  </style>

<script>
  const TABLE = "sidebar_genericsidebar";
  const COPILOT_FILE_TYPE_VALUE = 172520002;
  const DEFAULT_IFRAME_ALLOW = "clipboard-write; microphone; camera; autoplay; encrypted-media";

  function getParams() {
    const url = new URL(window.location.href);
    const data = url.searchParams.get("data");
    const qs = data ? new URLSearchParams(data) : url.searchParams;
    return Object.fromEntries(qs.entries());
  }

  function ensureFullHeightHtml(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const style = doc.createElement("style");
      style.textContent = `
        html, body {
          height: 100%; width: 100%;
          margin: 0; padding: 0;
          overflow-y: auto !important;
          overflow-x: hidden;
          display: flex; flex-direction: column;
        }
        body > * {
          flex: 1 1 auto;
          width: 100% !important;
        }
      `;
      doc.head.appendChild(style);
      return doc.documentElement.outerHTML;
    } catch {
      return html;
    }
  }

  function bodyInnerHTMLIfFullDoc(html) {
    const lower = (html || "").trim().toLowerCase();
    if (!lower.includes("<html") && !lower.includes("<body")) return html;
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      return doc.body ? doc.body.innerHTML : html;
    } catch {
      return html;
    }
  }

  function tidyLists(root) {
    root.querySelectorAll("li > p:only-child").forEach((paragraph) => {
      const item = paragraph.parentElement;
      while (paragraph.firstChild) item.insertBefore(paragraph.firstChild, paragraph);
      paragraph.remove();
    });
    root.querySelectorAll("li").forEach((item) => {
      const text = (item.textContent || "").replace(/\u00a0/g, " ").trim();
      if (!text && !item.querySelector("img,video,iframe,table")) item.remove();
    });
    root.querySelectorAll("ul,ol").forEach((list) => {
      if (!list.querySelector("li")) list.remove();
    });
  }

  function normalizeColor(value) {
    return typeof value === "string" ? value.trim() : "";
  }

  function normalizeColors(rec) {
    return {
      primary: normalizeColor(rec.sidebar_primarycolor),
      text: normalizeColor(rec.sidebar_textcolor),
      link: normalizeColor(rec.sidebar_linkcolor)
    };
  }

  function applyHostColors(colors) {
    const root = document.documentElement.style;
    if (colors.primary) {
      root.setProperty("--band-bg", colors.primary);
      root.setProperty("--sidebar-primary", colors.primary);
    }
    if (colors.text) {
      root.setProperty("--band-fg", colors.text);
      root.setProperty("--sidebar-text", colors.text);
    }
    if (colors.link) {
      root.setProperty("--band-marker", colors.link);
      root.setProperty("--sidebar-link", colors.link);
    }
  }

  function applyDocumentColors(html, colors) {
    if (!colors.primary && !colors.text && !colors.link) return html;
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const style = doc.createElement("style");
      style.dataset.sidebarTheme = "true";
      style.textContent = `:root {
        --sidebar-primary: ${colors.primary || "#0f5c73"};
        --sidebar-text: ${colors.text || "#ffffff"};
        --sidebar-link: ${colors.link || colors.primary || "#0078d4"};
        --primary-color: var(--sidebar-primary);
        --text-color: var(--sidebar-text);
        --link-color: var(--sidebar-link);
      }`;
      doc.head.appendChild(style);
      return doc.documentElement.outerHTML;
    } catch {
      return html;
    }
  }

  function applyCopilotTheme(url, colors) {
    if (!url || (!url.includes("powerva.microsoft.com") && !url.includes("copilotstudio.microsoft.com"))) {
      return url;
    }
    if (!colors.primary && !colors.text && !colors.link) return url;
    try {
      const themedUrl = new URL(url);
      const options = {
        styleOptions: {
          headerBackground: colors.primary || "#f0f0f0",
          bubbleBackground: colors.primary || "#0078d4",
          bubbleTextColor: colors.text || "#ffffff",
          suggestedActionBackground: "#ffffff",
          suggestedActionTextColor: colors.link || colors.primary || "#0078d4"
        }
      };
      themedUrl.searchParams.set("b", btoa(JSON.stringify(options)));
      return themedUrl.toString();
    } catch {
      return url;
    }
  }

  function prepareHtmlEmbed(html, colors, isCopilot) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      if (isCopilot) {
        const embeddedFrame = doc.querySelector("iframe[src]");
        if (embeddedFrame) {
          embeddedFrame.setAttribute("src", applyCopilotTheme(embeddedFrame.getAttribute("src"), colors));
        }
      }
      return applyDocumentColors(doc.documentElement.outerHTML, colors);
    } catch {
      return applyDocumentColors(html, colors);
    }
  }

  function positiveNumber(value) {
    const number = Number(value);
    return Number.isFinite(number) && number > 0 ? number : null;
  }

  function applyIframeOptions(rec, iframe) {
    const customStyle = typeof rec.sidebar_iframestyle === "string" ? rec.sidebar_iframestyle.trim() : "";
    if (customStyle) iframe.style.cssText = customStyle;
    const width = positiveNumber(rec.sidebar_iframewidth);
    const height = positiveNumber(rec.sidebar_iframeheight);
    iframe.style.width = width ? `${width}px` : (iframe.style.width || "100%");
    iframe.style.height = height ? `${height}px` : (iframe.style.height || "100%");
    iframe.style.flex = height ? `0 0 ${height}px` : (iframe.style.flex || "1 1 0%");
    const configuredAllow = typeof rec.sidebar_iframeallow === "string" ? rec.sidebar_iframeallow.trim() : "";
    iframe.setAttribute("allow", configuredAllow || DEFAULT_IFRAME_ALLOW);
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
  }

  function buildPanels(rec) {
    const panels = [];
    [
      [1, "sidebar_title1", "sidebar_instructions", "sidebar_embedcode"],
      [2, "sidebar_title2", "sidebar_instructions2", "sidebar_embedcode2"],
      [3, "sidebar_title3", "sidebar_instructions3", "sidebar_embedcode3"],
      [4, "sidebar_title4", "sidebar_instructions4", "sidebar_embedcode4"]
    ].forEach(([index, titleField, instructionField, embedField]) => {
      const embed = typeof rec[embedField] === "string" ? rec[embedField].trim() : "";
      if (!embed) return;
      panels.push({
        index,
        title: (rec[titleField] || (index === 1 ? rec.sidebar_title : "") || "").trim() || `Panel ${index}`,
        instr: (rec[instructionField] || "").trim(),
        embed
      });
    });
    return panels;
  }

  // For iframe widgets (Copilot, Canvas Apps) - full height but top-aligned
  function ensureFullHeightIframeWidget(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const style = doc.createElement("style");
      style.textContent = `
        html, body {
          height: 100%; width: 100%;
          margin: 0; padding: 0;
          overflow: hidden;
        }
        body {
          display: flex;
          flex-direction: column;
          align-items: stretch;
        }
        iframe {
          flex: 1;
          width: 100% !important;
          height: 100% !important;
          border: none;
        }
      `;
      doc.head.appendChild(style);
      return doc.documentElement.outerHTML;
    } catch {
      return html;
    }
  }

  function resolveEmbed(raw) {
    const t = (raw || "").trim();
    if (!t) return null;

    if (t.startsWith("<")) {
      // Check if this HTML contains an iframe with src - extract it for pop-out capability
      const iframeMatch = t.match(/<iframe[^>]+src=["']([^"']+)["']/i);
      const extractedUrl = iframeMatch ? iframeMatch[1] : null;
      console.log("Sidebar resolveEmbed: HTML mode, extractedUrl =", extractedUrl);
      return { mode: "html", html: t, extractedUrl };
    }

    const base = parent.Xrm.Utility.getGlobalContext().getClientUrl();
    if (/^webresource:/i.test(t)) return { mode: "url", url: `${base}/WebResources/${t.replace(/^webresource:/i,"")}` };

    return { mode: "url", url: t };
  }

  function toggleZoom() {
    const iframe = document.querySelector(".panel-container iframe:not([style*='display: none'])");
    const btn = document.getElementById("zoomToggle");
    if (!iframe) return;

    iframe.classList.toggle("force-zoom");
    btn.classList.toggle("active");
    btn.textContent = iframe.classList.contains("force-zoom") ? "⤢ Reset" : "⤢ Fit";
  }

  // Track the currently active URL and panel for pop-out
  let currentPopoutUrl = null;
  let currentPopoutPanelIndex = null;
  let popoutWindow = null;

  function popOutPanel() {
    if (!currentPopoutUrl) return;
    // Calculate position for easy snap-to-side (right side of screen)
    const width = 450;
    const height = screen.availHeight - 50;
    const left = screen.availWidth - width - 10;
    const top = 25;

    // Open with a window name so we can track it
    popoutWindow = window.open(
      currentPopoutUrl,
      "SidebarPopout",
      `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
    );

    // Show placeholder in the sidebar
    if (popoutWindow && currentPopoutPanelIndex !== null) {
      showPopoutPlaceholder(currentPopoutPanelIndex);
    }
  }

  function focusPopoutWindow() {
    if (popoutWindow && !popoutWindow.closed) {
      popoutWindow.focus();
    } else {
      // Window was closed externally, restore embedded content
      restoreEmbeddedContent();
    }
  }

  function showPopoutPlaceholder(panelIndex) {
    const placeholder = document.getElementById("popoutPlaceholder");
    const iframe = document.querySelector(`iframe[data-panel-index="${panelIndex}"]`);

    if (iframe) {
      iframe.style.display = "none";
    }
    placeholder.classList.add("active");

    // Hide pop-out button when already popped out
    document.getElementById("popoutBtn").style.display = "none";
  }

  function restoreEmbeddedContent() {
    const placeholder = document.getElementById("popoutPlaceholder");
    placeholder.classList.remove("active");

    // Close pop-out window if still open
    if (popoutWindow && !popoutWindow.closed) {
      popoutWindow.close();
    }
    popoutWindow = null;

    // Show the iframe again
    if (currentPopoutPanelIndex !== null) {
      const iframe = document.querySelector(`iframe[data-panel-index="${currentPopoutPanelIndex}"]`);
      if (iframe) {
        iframe.style.display = "block";
      }
    }

    // Show pop-out button again
    document.getElementById("popoutBtn").style.display = "block";
  }

  function checkPopoutWindow() {
    if (popoutWindow && popoutWindow.closed) {
      restoreEmbeddedContent();
    }
  }

  setInterval(checkPopoutWindow, 1000);

  function renderPlaceholder(message) {
    const host = document.getElementById("host");
    host.replaceChildren();
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.textContent = message;
    host.appendChild(placeholder);
  }

  function renderError(error) {
    const host = document.getElementById("host");
    const instBand = document.getElementById("instBand");
    instBand.style.display = "none";
    host.replaceChildren();
    const errorElement = document.createElement("div");
    errorElement.className = "error";
    errorElement.textContent = `Could not load configuration. ${error?.message || "Unknown error."}`;
    host.appendChild(errorElement);
  }

  function saveActivePanel(configId, index) {
    try {
      sessionStorage.setItem(`sidebar_activePanel_${configId}`, String(index));
    } catch (error) {
      console.log("Could not save panel state:", error);
    }
  }

  function getInitialPanel(configId, panelCount) {
    try {
      const saved = Number.parseInt(sessionStorage.getItem(`sidebar_activePanel_${configId}`), 10);
      return Number.isInteger(saved) && saved >= 0 && saved < panelCount ? saved : 0;
    } catch {
      return 0;
    }
  }

  function createPanelFrame(panel, rec, configId, position, colors) {
    const target = resolveEmbed(panel.embed);
    if (!target) return null;

    const iframe = document.createElement("iframe");
    iframe.className = "panel-frame framed";
    iframe.dataset.panelIndex = String(position);
    iframe.dataset.configId = configId;

    if (target.mode === "html") {
      const hasEmbeddedIframe = Boolean(target.extractedUrl);
      let processedHtml = prepareHtmlEmbed(
        target.html,
        colors,
        Number(rec.sidebar_filetype) === COPILOT_FILE_TYPE_VALUE
      );
      processedHtml = hasEmbeddedIframe
        ? ensureFullHeightIframeWidget(processedHtml)
        : ensureFullHeightHtml(processedHtml);
      iframe.srcdoc = processedHtml;
      iframe.dataset.isHtml = "true";
      iframe.dataset.hasEmbeddedIframe = String(hasEmbeddedIframe);
      if (target.extractedUrl) {
        iframe.dataset.popoutUrl = Number(rec.sidebar_filetype) === COPILOT_FILE_TYPE_VALUE
          ? applyCopilotTheme(target.extractedUrl, colors)
          : target.extractedUrl;
      }
    } else {
      iframe.src = target.url;
      iframe.dataset.isHtml = "false";
      iframe.dataset.popoutUrl = target.url;
      const title = panel.title.toLowerCase();
      if (title.includes("phone") || title.includes("genesys")) {
        iframe.classList.add("force-zoom");
        iframe.classList.remove("framed");
        iframe.dataset.autoZoom = "true";
      }
    }

    applyIframeOptions(rec, iframe);
    iframe.style.display = "none";
    return iframe;
  }

  function renderRuntime(rec, configId) {
    const panels = buildPanels(rec);
    if (!panels.length) {
      renderPlaceholder("No panels configured.");
      return null;
    }

    const colors = normalizeColors(rec);
    applyHostColors(colors);
    const instBand = document.getElementById("instBand");
    const instBody = document.getElementById("instBody");
    const zoomBtn = document.getElementById("zoomToggle");
    const popoutBtn = document.getElementById("popoutBtn");
    const panelContainer = document.getElementById("panelContainer");
    const tabRow = document.getElementById("tabRow");

    const iframes = panels.map((panel, index) => createPanelFrame(panel, rec, configId, index, colors));
    panelContainer.replaceChildren(...iframes.filter(Boolean));
    tabRow.replaceChildren();
    tabRow.style.display = panels.length > 1 ? "flex" : "none";

    function setActivePanel(index) {
      const panel = panels[index];
      const activeIframe = iframes[index];
      if (!panel || !activeIframe) return false;
      if (document.getElementById("popoutPlaceholder").classList.contains("active") && currentPopoutPanelIndex !== index) {
        restoreEmbeddedContent();
      }

      saveActivePanel(configId, index);
      Array.from(tabRow.children).forEach((tab, tabIndex) => tab.classList.toggle("active", tabIndex === index));
      iframes.forEach((iframe, iframeIndex) => {
        if (iframe) iframe.style.display = iframeIndex === index ? "block" : "none";
      });

      if (panel.instr) {
        instBody.innerHTML = bodyInnerHTMLIfFullDoc(panel.instr);
        tidyLists(instBody);
        instBand.style.display = "block";
      } else {
        instBody.replaceChildren();
        instBand.style.display = "none";
      }

      const isHtml = activeIframe.dataset.isHtml === "true";
      zoomBtn.style.display = isHtml ? "none" : "block";
      zoomBtn.classList.toggle("active", activeIframe.classList.contains("force-zoom"));
      zoomBtn.textContent = activeIframe.classList.contains("force-zoom") ? "Reset" : "Fit";

      if (activeIframe.dataset.popoutUrl) {
        popoutBtn.style.display = "block";
        currentPopoutUrl = activeIframe.dataset.popoutUrl;
        currentPopoutPanelIndex = index;
      } else {
        popoutBtn.style.display = "none";
        currentPopoutUrl = null;
        currentPopoutPanelIndex = null;
      }
      return true;
    }

    if (panels.length > 1) {
      panels.forEach((panel, index) => {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "tab";
        tab.textContent = panel.title;
        tab.addEventListener("click", () => setActivePanel(index));
        tabRow.appendChild(tab);
      });
    }

    setActivePanel(getInitialPanel(configId, panels.length));
    return { panels, iframes, setActivePanel };
  }

  async function loadConfigAndRender() {
    const { configId } = getParams();
    const panelContainer = document.getElementById("panelContainer");

    if (!configId) {
      renderPlaceholder("No configuration selected.");
      return;
    }

    // Check if we already rendered this config (survives pane hide/show)
    const existingIframes = panelContainer.querySelectorAll("iframe[data-config-id]");
    if (existingIframes.length > 0 && existingIframes[0].dataset.configId === configId) {
      console.log("Sidebar: Content already rendered for this config, skipping reload");
      return;
    }

    try {
      if (!parent?.Xrm?.WebApi) throw new Error("Xrm.WebApi not available.");
      const select =
        "?$select=" +
        "sidebar_title,sidebar_title1,sidebar_instructions,sidebar_embedcode," +
        "sidebar_title2,sidebar_instructions2,sidebar_embedcode2," +
        "sidebar_title3,sidebar_instructions3,sidebar_embedcode3," +
        "sidebar_title4,sidebar_instructions4,sidebar_embedcode4," +
        "sidebar_iframewidth,sidebar_iframeheight,sidebar_iframestyle,sidebar_iframeallow," +
        "sidebar_primarycolor,sidebar_textcolor,sidebar_linkcolor,sidebar_filetype";

      const rec = await parent.Xrm.WebApi.retrieveRecord(TABLE, configId, select);
      renderRuntime(rec, configId);
    } catch (error) {
      renderError(error);
    }
  }

  window.__GenericSidebarHtmlRuntime = {
    applyCopilotTheme,
    applyDocumentColors,
    applyIframeOptions,
    buildPanels,
    checkPopoutWindow,
    createPanelFrame,
    focusPopoutWindow,
    getInitialPanel,
    loadConfigAndRender,
    normalizeColors,
    popOutPanel,
    renderError,
    renderPlaceholder,
    renderRuntime,
    restoreEmbeddedContent,
    toggleZoom
  };

  window.addEventListener("load", loadConfigAndRender);
</script>
</head>

<body>
  <div id="instBand" class="inst-band">
    <div class="inst-label">Instructions</div>
    <div id="instBody" class="inst-body"></div>
  </div>

  <div id="host">
    <div id="tabRow" class="tabs"></div>
    <button id="popoutBtn" class="popout-btn" onclick="popOutPanel()" title="Open in new window">↗</button>
    <button id="zoomToggle" class="zoom-btn" onclick="toggleZoom()">⤢ Fit</button>
    <div id="panelContainer" class="panel-container"></div>
    <div id="popoutPlaceholder" class="popout-placeholder">
      <p>Content is open in a separate window.<br/>Use the buttons below to manage it.</p>
      <button class="focus-btn" onclick="focusPopoutWindow()">Bring to Front</button>
      <button class="restore-btn" onclick="restoreEmbeddedContent()">Restore Here</button>
      <p class="restore-note">Restoring returns the retained embedded frame to this panel.</p>
    </div>
  </div>
</body>
</html>
