<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar v2.15.5 - Full-Height Iframe Widgets</title>

  <style>
    :root { --band-bg:#0f5c73; --band-fg:#ffffff; }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: #fff;
      overflow: hidden;
    }

    body { display: flex; flex-direction: column; }
    * { box-sizing: border-box; }

    /* Instructions band */
    .inst-band {
      background: var(--band-bg);
      color: var(--band-fg);
      padding: 10px 12px;
      display: none;
      flex-shrink: 0;
    }
    .inst-label { font-size: 12px; font-weight: 600; }
    .inst-body { font-size: 12px; line-height: 1.35; }

    /* Layout Host */
    #host {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      padding: 16px;
      font-size: 12px;
      text-align: center;
    }

    .error {
      background: #fde7e9;
      border: 1px solid #d13438;
      padding: 12px;
      border-radius: 4px;
      margin: 8px;
      font-size: 12px;
      color: #a4262c;
    }

    /* Tabs */
    .tabs {
      display: flex;
      align-items: flex-end;
      padding: 4px 8px 0 8px;
      background: #f3f2f1;
      border-bottom: 1px solid #edebe9;
      gap: 4px;
      flex-shrink: 0;
      min-height: 32px;
    }

    .tab {
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      color: #605e5c;
      max-width: 240px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      background: transparent;
    }

    .tab.active {
      background: #ffffff;
      color: #201f1e;
      font-weight: 600;
      border-color: #edebe9;
      border-bottom-color: #ffffff;
    }

    /* Zoom Button */
    .zoom-btn {
      position: absolute;
      top: 4px;
      right: 8px;
      z-index: 25;
      background: transparent;
      border: 1px solid #edebe9;
      border-radius: 4px;
      color: #605e5c;
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
      display: none;
    }
    .zoom-btn:hover { background: #edebe9; }
    .zoom-btn.active {
      background: #c7e0f4;
      border-color: #0078d4;
      color: #0078d4;
      font-weight: 600;
    }

    /* Pop-out Button - now more visible */
    .popout-btn {
      position: absolute;
      top: 4px;
      right: 60px;
      z-index: 25;
      background: #f3f2f1;
      border: 1px solid #edebe9;
      border-radius: 4px;
      color: #323130;
      font-size: 14px;
      padding: 4px 8px;
      cursor: pointer;
      display: none;
    }
    .popout-btn:hover { 
      background: #edebe9;
      color: #0078d4;
    }

    /* Pop-out Placeholder - shows when content is popped out */
    .popout-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      z-index: 20;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .popout-placeholder.active {
      display: flex;
    }
    .popout-placeholder p {
      color: #605e5c;
      font-size: 13px;
      margin: 0;
      max-width: 280px;
    }
    .focus-btn, .restore-btn {
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #0078d4;
    }
    .focus-btn {
      background: #0078d4;
      color: white;
    }
    .focus-btn:hover {
      background: #106ebe;
    }
    .restore-btn {
      background: white;
      color: #0078d4;
    }
    .restore-btn:hover {
      background: #f3f2f1;
    }
    .restore-note {
      font-size: 11px;
      color: #a19f9d;
      margin-top: 12px;
    }

    /* Panel Container */
    .panel-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: #faf9f8;
    }

    .panel-container iframe {
      flex: 1;
      width: 100% !important;
      height: 100% !important;
      border: 0;
      display: block;
      overflow-y: auto !important;
      transition: transform 0.2s ease;
    }

    /* Non-zoomed iframes - subtle visual frame */
    .panel-container iframe:not(.force-zoom) {
      margin: 4px;
      width: calc(100% - 8px) !important;
      height: calc(100% - 8px) !important;
      border: 1px solid #e1dfdd;
      border-radius: 4px;
      background: white;
    }

    /* Zooming for Genesys / phone simulators - NO framing */
    .force-zoom {
      width: 320px !important;
      min-width: 320px !important;
      max-width: 320px !important;
      height: 64% !important;
      transform-origin: 0 0;
      transform: scale(1.56);
      margin: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      background: white !important;
    }
  </style>

<script>
  const TABLE = "sidebar_genericsidebar";
  const AGENT_TABLE = "sidebar_genericsidebaragent";
  const COPILOT_FILE_TYPE_VALUE = 172520002;

  function getParams() {
    const url = new URL(window.location.href);
    const data = url.searchParams.get("data");
    const qs = data ? new URLSearchParams(data) : url.searchParams;
    return Object.fromEntries(qs.entries());
  }

  function ensureFullHeightHtml(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const style = doc.createElement("style");
      style.textContent = `
        html, body {
          height: 100%; width: 100%;
          margin: 0; padding: 0;
          overflow-y: auto !important;
          overflow-x: hidden;
          display: flex; flex-direction: column;
        }
        body > * {
          flex: 1 1 auto;
          width: 100% !important;
        }
      `;
      doc.head.appendChild(style);
      return doc.documentElement.outerHTML;
    } catch {
      return html;
    }
  }

  // For iframe widgets (Copilot, Canvas Apps) - full height but top-aligned
  function ensureFullHeightIframeWidget(html) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const style = doc.createElement("style");
      style.textContent = `
        html, body {
          height: 100%; width: 100%;
          margin: 0; padding: 0;
          overflow: hidden;
        }
        body {
          display: flex;
          flex-direction: column;
          align-items: stretch;
        }
        iframe {
          flex: 1;
          width: 100% !important;
          height: 100% !important;
          border: none;
        }
      `;
      doc.head.appendChild(style);
      return doc.documentElement.outerHTML;
    } catch {
      return html;
    }
  }

  function resolveEmbed(raw) {
    const t = (raw || "").trim();
    if (!t) return null;
    
    if (t.startsWith("<")) {
      // Check if this HTML contains an iframe with src - extract it for pop-out capability
      const iframeMatch = t.match(/<iframe[^>]+src=["']([^"']+)["']/i);
      const extractedUrl = iframeMatch ? iframeMatch[1] : null;
      console.log("Sidebar resolveEmbed: HTML mode, extractedUrl =", extractedUrl);
      return { mode: "html", html: t, extractedUrl };
    }

    const base = parent.Xrm.Utility.getGlobalContext().getClientUrl();
    if (/^webresource:/i.test(t)) return { mode: "url", url: `${base}/WebResources/${t.replace(/^webresource:/i,"")}` };

    return { mode: "url", url: t };
  }

  function parseAgentMenuTab(value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return null;
    if (n >= 1 && n <= 4) return n;
    if (n === 100000001) return 1;
    if (n === 100000002) return 2;
    if (n === 100000003) return 3;
    if (n === 100000004) return 4;
    return null;
  }

  async function getLinkedAgentSummary(configId) {
    if (!configId) return { hasLinkedAgents: false, count: 0 };
    try {
      const q =
        "?$select=sidebar_genericsidebaragentid" +
        "&$filter=_sidebar_genericsidebarid_value eq " + configId + " and sidebar_isactive eq true and statecode eq 0";
      const r = await parent.Xrm.WebApi.retrieveMultipleRecords(AGENT_TABLE, q);
      const count = Array.isArray(r.entities) ? r.entities.length : 0;
      return { hasLinkedAgents: count > 0, count: count };
    } catch (e) {
      console.warn("Linked agent lookup failed:", e);
      return { hasLinkedAgents: false, count: 0 };
    }
  }

  async function retrieveSidebarConfig(configId) {
    const baseSelect =
      "sidebar_title1,sidebar_instructions,sidebar_embedcode," +
      "sidebar_title2,sidebar_instructions2,sidebar_embedcode2," +
      "sidebar_title3,sidebar_instructions3,sidebar_embedcode3," +
      "sidebar_title4,sidebar_instructions4,sidebar_embedcode4," +
      "sidebar_iframewidth,sidebar_iframeheight,sidebar_iframestyle,sidebar_iframeallow," +
      "sidebar_primarycolor,sidebar_textcolor,sidebar_linkcolor,sidebar_filetype";

    const extendedSelect = "?$select=" + baseSelect + ",sidebar_agentmenutab";
    const fallbackSelect = "?$select=" + baseSelect;

    try {
      return await parent.Xrm.WebApi.retrieveRecord(TABLE, configId, extendedSelect);
    } catch (e) {
      const msg = (e && e.message) ? e.message.toLowerCase() : "";
      if (msg.indexOf("sidebar_agentmenutab") >= 0 || msg.indexOf("could not find a property") >= 0) {
        console.warn("sidebar_agentmenutab not found yet; using legacy config select");
        return await parent.Xrm.WebApi.retrieveRecord(TABLE, configId, fallbackSelect);
      }
      throw e;
    }
  }

  function toggleZoom() {
    const iframe = document.querySelector(".panel-container iframe:not([style*='display: none'])");
    const btn = document.getElementById("zoomToggle");
    if (!iframe) return;

    iframe.classList.toggle("force-zoom");
    btn.classList.toggle("active");
    btn.textContent = iframe.classList.contains("force-zoom") ? "⤢ Reset" : "⤢ Fit";
  }

  // Track the currently active URL and panel for pop-out
  let currentPopoutUrl = null;
  let currentPopoutPanelIndex = null;
  let popoutWindow = null;

  function popOutPanel() {
    if (!currentPopoutUrl) return;
    // Calculate position for easy snap-to-side (right side of screen)
    const width = 450;
    const height = screen.availHeight - 50;
    const left = screen.availWidth - width - 10;
    const top = 25;
    
    // Open with a window name so we can track it
    popoutWindow = window.open(
      currentPopoutUrl,
      "SidebarPopout",
      `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
    );
    
    // Show placeholder in the sidebar
    if (popoutWindow && currentPopoutPanelIndex !== null) {
      showPopoutPlaceholder(currentPopoutPanelIndex);
    }
  }

  function focusPopoutWindow() {
    if (popoutWindow && !popoutWindow.closed) {
      popoutWindow.focus();
    } else {
      // Window was closed externally, restore embedded content
      restoreEmbeddedContent();
    }
  }

  function showPopoutPlaceholder(panelIndex) {
    const placeholder = document.getElementById("popoutPlaceholder");
    const iframe = document.querySelector(`iframe[data-panel-index="${panelIndex}"]`);
    
    if (iframe) {
      iframe.style.display = "none";
    }
    placeholder.classList.add("active");
    
    // Hide pop-out button when already popped out
    document.getElementById("popoutBtn").style.display = "none";
  }

  function restoreEmbeddedContent() {
    const placeholder = document.getElementById("popoutPlaceholder");
    placeholder.classList.remove("active");
    
    // Close pop-out window if still open
    if (popoutWindow && !popoutWindow.closed) {
      popoutWindow.close();
    }
    popoutWindow = null;
    
    // Show the iframe again
    if (currentPopoutPanelIndex !== null) {
      const iframe = document.querySelector(`iframe[data-panel-index="${currentPopoutPanelIndex}"]`);
      if (iframe) {
        iframe.style.display = "block";
      }
    }
    
    // Show pop-out button again
    document.getElementById("popoutBtn").style.display = "block";
  }

  // Check if pop-out window was closed externally
  setInterval(() => {
    if (popoutWindow && popoutWindow.closed) {
      restoreEmbeddedContent();
    }
  }, 1000);

  async function loadConfigAndRender() {
    const { configId, mode } = getParams();
    const host = document.getElementById("host");
    const instBand = document.getElementById("instBand");
    const zoomBtn = document.getElementById("zoomToggle");
    const panelContainer = document.getElementById("panelContainer");
    const tabRow = document.getElementById("tabRow");

    if (!configId) {
      host.innerHTML = '<div class="placeholder">No configuration selected.</div>';
      return;
    }

    // Check if we already rendered this config (survives pane hide/show)
    const existingIframes = panelContainer.querySelectorAll("iframe[data-config-id]");
    if (existingIframes.length > 0 && existingIframes[0].dataset.configId === configId) {
      console.log("Sidebar: Content already rendered for this config, skipping reload");
      // Restore active panel from sessionStorage if available
      const savedPanel = sessionStorage.getItem("sidebar_activePanel_" + configId);
      if (savedPanel !== null) {
        const idx = parseInt(savedPanel, 10);
        const activeIframe = panelContainer.querySelector(`iframe[data-panel-index="${idx}"]`);
        if (activeIframe) {
          existingIframes.forEach(f => f.style.display = "none");
          activeIframe.style.display = "block";
        }
      }
      return;
    }

    try {
      const rec = await retrieveSidebarConfig(configId);
      const linkedAgents = await getLinkedAgentSummary(configId);

      const panels = [];
      function addPanel(idx, titleField, instrField, embedField) {
        const embed = (rec[embedField] || "").trim();
        if (!embed) return;
        panels.push({
          index: idx,
          title: (rec[titleField] || "").trim(),
          instr: (rec[instrField] || "").trim(),
          embedField,
          embedRaw: embed
        });
      }

      addPanel(1, "sidebar_title1", "sidebar_instructions",  "sidebar_embedcode");
      addPanel(2, "sidebar_title2", "sidebar_instructions2", "sidebar_embedcode2");
      addPanel(3, "sidebar_title3", "sidebar_instructions3", "sidebar_embedcode3");
      addPanel(4, "sidebar_title4", "sidebar_instructions4", "sidebar_embedcode4");

      const agentMenuTab = parseAgentMenuTab(rec.sidebar_agentmenutab);
      if (linkedAgents.hasLinkedAgents && agentMenuTab) {
        const base = parent.Xrm.Utility.getGlobalContext().getClientUrl();
        const pickerUrl = base + "/WebResources/vz_AgentSidePanelHTML.html?configId=" + encodeURIComponent(configId) + "&v=2.1.1";
        const existing = panels.find(function (p) { return p.index === agentMenuTab; });
        if (existing) {
          existing.embedRaw = pickerUrl;
          existing.title = existing.title || ("Linked Agents (" + linkedAgents.count + ")");
        } else {
          panels.push({
            index: agentMenuTab,
            title: "Linked Agents (" + linkedAgents.count + ")",
            instr: "",
            embedField: "",
            embedRaw: pickerUrl
          });
        }
      }

      panels.sort(function (a, b) { return a.index - b.index; });

      if (!panels.length) {
        host.innerHTML = '<div class="placeholder">No panels configured.</div>';
        return;
      }

      // Create all iframes upfront to preserve state when switching tabs
      const iframes = [];
      panelContainer.innerHTML = "";

      panels.forEach((panel, idx) => {
        const target = resolveEmbed(panel.embedRaw);
        if (!target) {
          iframes.push(null);
          return;
        }

        const iframe = document.createElement("iframe");
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.style.display = "none"; // Hidden by default
        iframe.dataset.panelIndex = idx;
        iframe.dataset.configId = configId; // Track which config this iframe belongs to

        if (target.mode === "html") {
          // Apply appropriate styling based on content type
          const hasEmbeddedIframe = !!target.extractedUrl;
          if (hasEmbeddedIframe) {
            // Iframe widgets (Copilot, Canvas Apps) - full height, top-aligned
            iframe.srcdoc = ensureFullHeightIframeWidget(target.html);
          } else {
            // Raw HTML - full height with flex layout
            iframe.srcdoc = ensureFullHeightHtml(target.html);
          }
          iframe.dataset.isHtml = "true";
          iframe.dataset.hasEmbeddedIframe = hasEmbeddedIframe ? "true" : "false";
          // If HTML contains an iframe, extract its URL for pop-out
          if (target.extractedUrl) {
            iframe.dataset.popoutUrl = target.extractedUrl;
          }
        } else {
          iframe.src = target.url;
          iframe.dataset.isHtml = "false";
          iframe.dataset.popoutUrl = target.url; // Store URL for pop-out

          const lower = panel.title.toLowerCase();
          if (lower.includes("phone") || lower.includes("genesys")) {
            iframe.classList.add("force-zoom");
            iframe.dataset.autoZoom = "true";
          }
        }

        iframe.setAttribute(
          "allow",
          "clipboard-write; microphone; camera; autoplay; encrypted-media"
        );

        panelContainer.appendChild(iframe);
        iframes.push(iframe);
      });

      const shouldShowTabRow = panels.length > 1 || (panels.length === 1 && panels[0].index > 1);
      if (shouldShowTabRow) {
        tabRow.style.display = "flex";
        tabRow.innerHTML = "";
        panels.forEach((p, idx) => {
          const btn = document.createElement("button");
          btn.className = "tab";
          btn.textContent = p.title;
          if (p.title) {
            btn.title = p.title;
          }
          if (idx < 4) {
            btn.setAttribute("aria-label", (p.title || "Tab") + " (Alt+" + (idx + 1) + ")");
          }
          btn.onclick = () => setActivePanel(idx);
          tabRow.appendChild(btn);
        });
      } else {
        tabRow.style.display = "none";
      }

      function setActivePanel(idx) {
        const panel = panels[idx];
        if (!panel) return;

        // Save active panel to sessionStorage for persistence across pane switches
        try {
          sessionStorage.setItem("sidebar_activePanel_" + configId, idx.toString());
        } catch (e) {
          console.log("Could not save panel state:", e);
        }

        if (panels.length > 1) {
          Array.from(tabRow.children).forEach((t, i) =>
            t.classList.toggle("active", i === idx)
          );
        }

        if (panel.instr) {
          instBand.style.display = "block";
          document.getElementById("instBody").innerHTML =
            ensureFullHeightHtml(panel.instr);
        } else {
          instBand.style.display = "none";
        }

        // Hide all iframes, show only the active one (preserves state)
        iframes.forEach((iframe, i) => {
          if (iframe) {
            iframe.style.display = i === idx ? "block" : "none";
          }
        });

        const activeIframe = iframes[idx];
        const popoutBtn = document.getElementById("popoutBtn");
        if (activeIframe) {
          const isHtml = activeIframe.dataset.isHtml === "true";
          const hasPopoutUrl = !!activeIframe.dataset.popoutUrl;
          console.log("Sidebar setActivePanel:", idx, "isHtml=", isHtml, "hasPopoutUrl=", hasPopoutUrl, "popoutUrl=", activeIframe.dataset.popoutUrl);
          
          // Zoom button only for URL embeds (not HTML)
          if (isHtml) {
            zoomBtn.style.display = "none";
          } else {
            zoomBtn.style.display = "block";
            if (activeIframe.classList.contains("force-zoom")) {
              zoomBtn.classList.add("active");
              zoomBtn.textContent = "⤢ Reset";
            } else {
              zoomBtn.classList.remove("active");
              zoomBtn.textContent = "⤢ Fit";
            }
          }
          
          // Pop-out button shows if there's a URL (even for HTML with iframe src)
          if (hasPopoutUrl) {
            popoutBtn.style.display = "block";
            currentPopoutUrl = activeIframe.dataset.popoutUrl;
            currentPopoutPanelIndex = idx;
          } else {
            popoutBtn.style.display = "none";
            currentPopoutUrl = null;
            currentPopoutPanelIndex = null;
          }
        }
        
        // Reset placeholder state when switching tabs
        document.getElementById("popoutPlaceholder").classList.remove("active");
      }

      // Register tab shortcuts each render pass, replacing any previous handler.
      // Alt+1..Alt+4 is used instead of Ctrl+number because browsers reserve Ctrl+number for tab switching.
      if (window.__sidebarTabHotkeyHandler) {
        document.removeEventListener("keydown", window.__sidebarTabHotkeyHandler);
      }
      window.__sidebarTabHotkeyHandler = function (event) {
        if (!event.altKey || event.ctrlKey || event.shiftKey || event.metaKey) return;

        var targetEl = event.target;
        var tagName = targetEl && targetEl.tagName ? targetEl.tagName.toLowerCase() : "";
        if (tagName === "input" || tagName === "textarea" || tagName === "select" || (targetEl && targetEl.isContentEditable)) {
          return;
        }

        var numeric = parseInt(event.key, 10);
        if (!Number.isFinite(numeric) || numeric < 1 || numeric > 4) return;

        var requestedIndex = numeric - 1;
        if (requestedIndex >= panels.length) return;

        event.preventDefault();
        setActivePanel(requestedIndex);
      };
      document.addEventListener("keydown", window.__sidebarTabHotkeyHandler);

      // Restore active panel from sessionStorage, or default to panel 0
      let initialPanel = 0;
      try {
        const savedPanel = sessionStorage.getItem("sidebar_activePanel_" + configId);
        if (savedPanel !== null) {
          const parsed = parseInt(savedPanel, 10);
          if (!isNaN(parsed) && parsed >= 0 && parsed < panels.length) {
            initialPanel = parsed;
          }
        }
      } catch (e) {
        console.log("Could not restore panel state:", e);
      }
      setActivePanel(initialPanel);

    } catch (e) {
      host.innerHTML = `<div class="error">${e.message}</div>`;
    }
  }

  window.addEventListener("load", loadConfigAndRender);
</script>
</head>

<body>
  <div id="instBand" class="inst-band">
    <div class="inst-label">Instructions</div>
    <div id="instBody" class="inst-body"></div>
  </div>

  <div id="host">
    <div id="tabRow" class="tabs"></div>
    <button id="popoutBtn" class="popout-btn" onclick="popOutPanel()" title="Open in new window">↗</button>
    <button id="zoomToggle" class="zoom-btn" onclick="toggleZoom()">⤢ Fit</button>
    <div id="panelContainer" class="panel-container"></div>
    <div id="popoutPlaceholder" class="popout-placeholder">
      <p>Content is open in a separate window.<br/>Use the buttons below to manage it.</p>
      <button class="focus-btn" onclick="focusPopoutWindow()">Bring to Front</button>
      <button class="restore-btn" onclick="restoreEmbeddedContent()">Restore Here</button>
      <p class="restore-note">Note: Restoring will reload the content and reset any chat conversation.</p>
    </div>
  </div>
</body>
</html>
